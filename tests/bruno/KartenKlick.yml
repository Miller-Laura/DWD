info:
  name: KartenKlick
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/auswertung?lat=51.5&lon=7.5&von=2000-01-01&bis=2005-12-31&stufe=jahr&radius=15"
  params:
    - name: lat
      value: "51.5"
      type: query
    - name: lon
      value: "7.5"
      type: query
    - name: von
      value: 2000-01-01
      type: query
    - name: bis
      value: 2005-12-31
      type: query
    - name: stufe
      value: jahr
      type: query
    - name: radius
      value: "15"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Stationen und 6 Jahreswerte", function () {
          expect(res.body.stationen.length).to.be.greaterThan(0);
          expect(res.body.zeilen.length).to.equal(6);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
