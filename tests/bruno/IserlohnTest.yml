info:
  name: IserlohnTest
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:5000/api/auswertung?ort=Iserlohn&von=1930-01-01&bis=2010-12-31&stufe=jahr&radius=15
  params:
    - name: ort
      value: Iserlohn
      type: query
    - name: von
      value: 1930-01-01
      type: query
    - name: bis
      value: 2010-12-31
      type: query
    - name: stufe
      value: jahr
      type: query
    - name: radius
      value: "15"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("mehr als 50 Jahreswerte und mindestens eine Station", function () {
          expect(res.body.zeilen.length).to.be.greaterThan(50);
          expect(res.body.stationen.length).to.be.greaterThan(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
